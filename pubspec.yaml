name: esp_sekou
description: Plateforme d'intégration des Sekou de l'ESP UCAD Dakar.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^14.6.2

  # Animations
  flutter_animate: ^4.5.0

  # Audio
  just_audio: ^0.9.42

  # OneSignal
  onesignal_flutter: ^5.2.5

  # HTTP
  http: ^1.2.1

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utils
  intl: ^0.19.0
  timeago: ^3.7.0
  shared_preferences: ^2.3.2
  flutter_dotenv: ^6.0.1

  # UI
  gap: ^3.0.1
  url_launcher: ^6.3.0
  flutter_linkify: ^6.0.0
  supabase_flutter: ^2.14.2
  record: ^6.2.1
  audioplayers: ^6.7.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  emoji_picker_flutter: ^4.4.0
  animated_emoji: ^3.2.1
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/parrots/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F5F7FF"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    color: "#F5F7FF"
